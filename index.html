<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Attendance Management System</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Attendance Tracker</h1>
            <p>Student Attendance Tracker</p>
            <p id="todayDate"></p>
        </header>

        <section class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card present-card">
                <h3>Present</h3>
                <p id="presentCount">0</p>
            </div>

            <div class="card absent-card">
                <h3>Absent</h3>
                <p id="absentCount">0</p>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <p id="attendancePercentage">0%</p>
            </div>

        </section>

        <section class="form-section">

            <h2>Mark Student Attendance</h2>

            <input type="text" id="name" placeholder="Student Name">

            <input type="text" id="roll" placeholder="Roll Number">

            <select id="department">
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
            </select>

            <button onclick="markAttendance('Present')">
                Mark Present
            </button>

            <button class="absent-btn" onclick="markAttendance('Absent')">
                Mark Absent
            </button>

        </section>

        <section class="filter-section">

            <h2>Department Attendance</h2>

            <select id="departmentFilter" onchange="displayAttendance()">
                <option value="All">All Departments</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
            </select>

            <input
                type="text"
                id="searchRoll"
                placeholder="Search Roll Number"
                onkeyup="displayAttendance()"
            >

        </section>

        <section class="table-section">

            <h2>Attendance Records</h2>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceList"></tbody>

                </table>

            </div>

        </section>

        <section class="chart-section">

            <h2>Department-wise Attendance Chart</h2>

            <div class="chart-container">
                <canvas id="attendanceChart"></canvas>
            </div>

        </section>

        <section class="action-section">

            <button onclick="downloadCSV()">
                Download Report
            </button>

            <button onclick="window.print()">
                Print Report
            </button>

            <button class="clear-btn" onclick="clearAllData()">
                Clear All
            </button>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
